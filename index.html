<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <title>Gestor de Ingresos y Gastos</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border-color: #2c2c2c;
            --accent: #444444;
            --accent-hover: #555555;
            --danger: #cf6679;
            --success: #81c784;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Pantalla de Bienvenida con Usuario */
        #welcome-screen {
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        #welcome-screen h1 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        #welcome-screen p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        #welcome-screen input {
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.95rem;
            padding: 10px;
        }

        /* Pantalla Principal (Oculta al inicio) */
        #app-screen {
            display: none;
            width: 100%;
            max-width: 1000px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h2 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #ffffff;
        }

        /* Botones Minimalistas */
        button, .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 400;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
            width: 100%;
        }

        button:hover, .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-inline {
            width: auto;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: #5c2626;
            color: #ff8080;
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-danger:hover {
            background-color: #702f2f;
        }

        .btn-compact {
            padding: 5px 10px;
            font-size: 0.75rem;
        }

        /* Contenedor de Años (Registros Anuales) */
        .year-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .year-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .year-card.minimized .year-header {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .year-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .year-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .months-list.hidden, .month-content.hidden {
            display: none;
        }

        /* Tarjeta de Mes */
        .month-card {
            background-color: #161616;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .month-card.minimized {
            padding-bottom: 20px;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .month-card.minimized .month-header {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .month-title {
            font-size: 1rem;
            font-weight: 600;
            text-transform: capitalize;
            color: #ffffff;
        }

        .month-actions {
            display: flex;
            gap: 6px;
        }

        /* Resumen de Totales */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #121212;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .summary-item label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .summary-item span {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .negative { color: var(--danger); }
        .positive { color: var(--success); }

        /* Secciones de Tablas (Ingresos y Gastos) */
        .sections-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .sections-container {
                grid-template-columns: 1fr;
            }
        }

        .sub-section h4 {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .inline-form {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        input, select {
            padding: 7px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            background: #161616;
            color: var(--text-main);
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: #666666;
        }

        .input-concept { flex: 2; min-width: 0; }
        .input-date { flex: 1.3; min-width: 0; }
        .input-amount { flex: 1; min-width: 0; }
        
        .inline-form button {
            padding: 7px 12px;
            font-size: 0.85rem;
            width: auto;
        }

        .table-container {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
            table-layout: fixed;
        }

        th {
            background-color: #121212;
            position: sticky;
            top: 0;
            font-weight: 500;
            color: var(--text-muted);
            padding: 7px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 7px 8px;
            border-bottom: 1px solid var(--border-color);
            word-break: break-word;
        }

        th:nth-child(1), td:nth-child(1) { width: 40%; }
        th:nth-child(2), td:nth-child(2) { width: 32%; }
        th:nth-child(3), td:nth-child(3) { width: 20%; }
        th:nth-child(4), td:nth-child(4) { width: 8%; text-align: center; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 15px;
            font-size: 0.8rem;
        }

        /* Modales */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 10px;
            width: 100%;
            max-width: 320px;
            border: 1px solid var(--border-color);
        }

        .modal h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 500;
            color: #ffffff;
        }

        .modal input, .modal select {
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .modal-actions button {
            width: auto;
        }
    </style>
</head>
<body>

    <!-- Pantalla 1: Ingreso de Usuario -->
    <div id="welcome-screen">
        <h1>Control Financiero</h1>
        <p>Ingresa tu nombre para comenzar a gestionar tus finanzas.</p>
        <input type="text" id="input-nombre-usuario" placeholder="Tu Nombre">
        <button id="btn-entrar">Entrar al Gestor</button>
    </div>

    <!-- Pantalla 2: Interfaz Principal -->
    <div id="app-screen">
        <header>
            <h2 id="header-title">Finanzas de Usuario</h2>
            <button class="btn-inline" id="btn-abrir-modal-anio">+ Nuevo Registro</button>
        </header>

        <div id="years-container">
            <div id="no-years" class="empty-state" style="padding: 40px;">
                No hay registros creados. Da clic en "+ Nuevo Registro" para comenzar.
            </div>
        </div>
    </div>

    <!-- Modal para Nuevo Registro (Año) -->
    <div id="modal-anio" class="modal-overlay">
        <div class="modal">
            <h3>Nuevo Registro Anual</h3>
            <input type="text" id="input-nombre-anio" placeholder="Ej. Año 2026 o Proyecto X">
            <div class="modal-actions">
                <button class="btn-secondary btn-inline" id="cancelar-anio">Cancelar</button>
                <button class="btn-inline" id="guardar-anio">Crear</button>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar Mes -->
    <div id="modal-mes" class="modal-overlay">
        <div class="modal">
            <h3>Seleccionar Mes</h3>
            <select id="select-mes">
                <option value="Enero">Enero</option>
                <option value="Febrero">Febrero</option>
                <option value="Marzo">Marzo</option>
                <option value="Abril">Abril</option>
                <option value="Mayo">Mayo</option>
                <option value="Junio">Junio</option>
                <option value="Julio">Julio</option>
                <option value="Agosto">Agosto</option>
                <option value="Septiembre">Septiembre</option>
                <option value="Octubre">Octubre</option>
                <option value="Noviembre">Noviembre</option>
                <option value="Diciembre">Diciembre</option>
            </select>
            <div class="modal-actions">
                <button class="btn-secondary btn-inline" id="cancelar-mes">Cancelar</button>
                <button class="btn-inline" id="guardar-mes">Agregar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Resumen de Año -->
    <div id="modal-resumen" class="modal-overlay">
        <div class="modal" style="max-width: 380px;">
            <h3 id="resumen-titulo-modal">Resumen Anual</h3>
            <div class="summary-grid" style="margin-bottom: 20px;">
                <div class="summary-item">
                    <label>Ingresos Totales</label>
                    <span id="resumen-ingresos" class="positive">$0.00</span>
                </div>
                <div class="summary-item">
                    <label>Gastos Totales</label>
                    <span id="resumen-gastos" class="negative">$0.00</span>
                </div>
                <div class="summary-item">
                    <label>Balance Neto Anual</label>
                    <span id="resumen-neto">$0.00</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-inline" id="cerrar-resumen">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let usuarioData = localStorage.getItem('nombreUsuario_finanzas') || '';
        let anosData = JSON.parse(localStorage.getItem('anosData_finanzas')) || [];
        let anioSeleccionadoId = null;

        const welcomeScreen = document.getElementById('welcome-screen');
        const appScreen = document.getElementById('app-screen');
        const inputNombreUsuario = document.getElementById('input-nombre-usuario');
        const btnEntrar = document.getElementById('btn-entrar');
        const headerTitle = document.getElementById('header-title');
        const yearsContainer = document.getElementById('years-container');

        const modalAnio = document.getElementById('modal-anio');
        const btnAbrirModalAnio = document.getElementById('btn-abrir-modal-anio');
        const cancelarAnio = document.getElementById('cancelar-anio');
        const guardarAnio = document.getElementById('guardar-anio');
        const inputNombreAnio = document.getElementById('input-nombre-anio');

        const modalMes = document.getElementById('modal-mes');
        const cancelarMes = document.getElementById('cancelar-mes');
        const guardarMes = document.getElementById('guardar-mes');
        const selectMes = document.getElementById('select-mes');

        const modalResumen = document.getElementById('modal-resumen');
        const cerrarResumen = document.getElementById('cerrar-resumen');
        const resumenTituloModal = document.getElementById('resumen-titulo-modal');
        const resumenIngresos = document.getElementById('resumen-ingresos');
        const resumenGastos = document.getElementById('resumen-gastos');
        const resumenNeto = document.getElementById('resumen-neto');

        if (usuarioData) {
            welcomeScreen.style.display = 'none';
            appScreen.style.display = 'block';
            headerTitle.textContent = `Finanzas de ${usuarioData}`;
            renderizarApp();
        }

        btnEntrar.addEventListener('click', () => {
            const nombre = inputNombreUsuario.value.trim();
            if (!nombre) {
                alert('Por favor ingresa tu nombre.');
                return;
            }
            usuarioData = nombre;
            localStorage.setItem('nombreUsuario_finanzas', usuarioData);
            welcomeScreen.style.display = 'none';
            appScreen.style.display = 'block';
            headerTitle.textContent = `Finanzas de ${usuarioData}`;
            renderizarApp();
        });

        function guardarEnMemoria() {
            localStorage.setItem('anosData_finanzas', JSON.stringify(anosData));
        }

        btnAbrirModalAnio.addEventListener('click', () => {
            inputNombreAnio.value = '';
            modalAnio.style.display = 'flex';
        });
        cancelarAnio.addEventListener('click', () => modalAnio.style.display = 'none');

        guardarAnio.addEventListener('click', () => {
            const nombreAnio = inputNombreAnio.value.trim();
            if (!nombreAnio) {
                alert('Ingresa un nombre para el registro.');
                return;
            }
            anosData.push({
                id: Date.now(),
                nombre: nombreAnio,
                minimizado: false,
                meses: []
            });
            guardarEnMemoria();
            modalAnio.style.display = 'none';
            renderizarApp();
        });

        function abrirModalMes(idAnio) {
            anioSeleccionadoId = idAnio;
            modalMes.style.display = 'flex';
        }
        cancelarMes.addEventListener('click', () => modalMes.style.display = 'none');

        guardarMes.addEventListener('click', () => {
            const nombreMes = selectMes.value;
            const anio = anosData.find(a => a.id === anioSeleccionadoId);
            
            if (anio.meses.some(m => m.nombre === nombreMes)) {
                alert('Este mes ya existe en este registro.');
                return;
            }

            anio.meses.push({
                id: Date.now(),
                nombre: nombreMes,
                minimizado: false, // Propiedad agregada para minimizar el mes
                ingresos: [],
                gastos: []
            });

            guardarEnMemoria();
            modalMes.style.display = 'none';
            renderizarApp();
        });

        function eliminarAnio(idAnio) {
            if (confirm('¿Eliminar este registro anual completo?')) {
                anosData = anosData.filter(a => a.id !== idAnio);
                guardarEnMemoria();
                renderizarApp();
            }
        }

        function toggleMinimizarAnio(idAnio) {
            const anio = anosData.find(a => a.id === idAnio);
            if (anio) {
                anio.minimizado = !anio.minimizado;
                guardarEnMemoria();
                renderizarApp();
            }
        }

        function toggleMinimizarMes(idAnio, idMes) {
            const anio = anosData.find(a => a.id === idAnio);
            if (anio) {
                const mes = anio.meses.find(m => m.id === idMes);
                if (mes) {
                    mes.minimizado = !mes.minimizado;
                    guardarEnMemoria();
                    renderizarApp();
                }
            }
        }

        function eliminarMes(idAnio, idMes) {
            if (confirm('¿Estás seguro de eliminar este mes?')) {
                const anio = anosData.find(a => a.id === idAnio);
                anio.meses = anio.meses.filter(m => m.id !== idMes);
                guardarEnMemoria();
                renderizarApp();
            }
        }

        function agregarMovimiento(idAnio, idMes, tipo) {
            const conceptoInput = document.getElementById(`${tipo}-concepto-${idMes}`);
            const fechaInput = document.getElementById(`${tipo}-fecha-${idMes}`);
            const montoInput = document.getElementById(`${tipo}-monto-${idMes}`);

            const concepto = conceptoInput.value.trim();
            const fecha = fechaInput.value;
            const monto = parseFloat(montoInput.value);

            if (!concepto || !fecha || isNaN(monto)) {
                alert('Completa todos los campos correctamente.');
                return;
            }

            const anio = anosData.find(a => a.id === idAnio);
            const mes = anio.meses.find(m => m.id === idMes);
            
            mes[tipo].push({ concepto, fecha, monto });
            guardarEnMemoria();
            
            conceptoInput.value = '';
            fechaInput.value = '';
            montoInput.value = '';
            renderizarApp();
        }

        function eliminarMovimiento(idAnio, idMes, tipo, index) {
            const anio = anosData.find(a => a.id === idAnio);
            const mes = anio.meses.find(m => m.id === idMes);
            mes[tipo].splice(index, 1);
            guardarEnMemoria();
            renderizarApp();
        }

        function generarResumenAnio(idAnio) {
            const anio = anosData.find(a => a.id === idAnio);
            let totalIngresosAnual = 0;
            let totalGastosAnual = 0;

            anio.meses.forEach(mes => {
                totalIngresosAnual += mes.ingresos.reduce((acc, item) => acc + item.monto, 0);
                totalGastosAnual += mes.gastos.reduce((acc, item) => acc + item.monto, 0);
            });

            const netoAnual = totalIngresosAnual - totalGastosAnual;

            resumenTituloModal.textContent = `Resumen: ${anio.nombre}`;
            resumenIngresos.textContent = `$${totalIngresosAnual.toFixed(2)}`;
            resumenGastos.textContent = `$${totalGastosAnual.toFixed(2)}`;
            resumenNeto.textContent = `$${netoAnual.toFixed(2)}`;
            resumenNeto.className = netoAnual < 0 ? 'negative' : 'positive';

            modalResumen.style.display = 'flex';
        }

        cerrarResumen.addEventListener('click', () => modalResumen.style.display = 'none');

        function renderizarApp() {
            if (anosData.length === 0) {
                yearsContainer.innerHTML = `<div id="no-years" class="empty-state" style="padding: 40px;">No hay registros creados. Da clic en "+ Nuevo Registro" para comenzar.</div>`;
                return;
            }

            yearsContainer.innerHTML = '';

            anosData.forEach(anio => {
                const yearCard = document.createElement('div');
                yearCard.className = `year-card ${anio.minimizado ? 'minimized' : ''}`;

                let mesesHTML = '';
                if (anio.meses.length === 0) {
                    mesesHTML = `<div class="empty-state">No hay meses agregados en este registro.</div>`;
                } else {
                    anio.meses.forEach(mes => {
                        const totalIngresos = mes.ingresos.reduce((acc, item) => acc + item.monto, 0);
                        const totalGastos = mes.gastos.reduce((acc, item) => acc + item.monto, 0);
                        const restante = totalIngresos - totalGastos;

                        mesesHTML += `
                            <div class="month-card ${mes.minimizado ? 'minimized' : ''}">
                                <div class="month-header">
                                    <span class="month-title">${mes.nombre}</span>
                                    <div class="month-actions">
                                        <button class="btn-secondary btn-inline btn-compact" onclick="toggleMinimizarMes(${anio.id}, ${mes.id})">${mes.minimizado ? 'Expandir' : 'Minimizar'}</button>
                                        <button class="btn-danger btn-compact" onclick="eliminarMes(${anio.id}, ${mes.id})">Eliminar Mes</button>
                                    </div>
                                </div>

                                <div class="month-content ${mes.minimizado ? 'hidden' : ''}">
                                    <div class="summary-grid">
                                        <div class="summary-item">
                                            <label>Ingresos</label>
                                            <span class="positive">$${totalIngresos.toFixed(2)}</span>
                                        </div>
                                        <div class="summary-item">
                                            <label>Gastos</label>
                                            <span class="negative">$${totalGastos.toFixed(2)}</span>
                                        </div>
                                        <div class="summary-item">
                                            <label>Restante Mes</label>
                                            <span class="${restante < 0 ? 'negative' : 'positive'}">$${restante.toFixed(2)}</span>
                                        </div>
                                    </div>

                                    <div class="sections-container">
                                        <!-- Ingresos -->
                                        <div class="sub-section">
                                            <h4>Ingresos</h4>
                                            <div class="inline-form">
                                                <input type="text" id="ingresos-concepto-${mes.id}" class="input-concept" placeholder="Concepto">
                                                <input type="date" id="ingresos-fecha-${mes.id}" class="input-date">
                                                <input type="number" id="ingresos-monto-${mes.id}" class="input-amount" placeholder="Monto" step="0.01">
                                                <button class="btn-inline" onclick="agregarMovimiento(${anio.id}, ${mes.id}, 'ingresos')">+</button>
                                            </div>
                                            <div class="table-container">
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th>Concepto</th>
                                                            <th>Fecha</th>
                                                            <th>Monto</th>
                                                            <th></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        ${mes.ingresos.length === 0 ? `<tr><td colspan="4" class="empty-state">Sin ingresos</td></tr>` : 
                                                            mes.ingresos.map((item, idx) => `
                                                                <tr>
                                                                    <td>${item.concepto}</td>
                                                                    <td>${item.fecha}</td>
                                                                    <td>$${item.monto.toFixed(2)}</td>
                                                                    <td style="text-align: center;"><button class="btn-danger" style="padding:2px 5px; font-size:0.65rem;" onclick="eliminarMovimiento(${anio.id}, ${mes.id}, 'ingresos', ${idx})">X</button></td>
                                                                </tr>
                                                            `).join('')}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <!-- Gastos -->
                                        <div class="sub-section">
                                            <h4>Gastos</h4>
                                            <div class="inline-form">
                                                <input type="text" id="gastos-concepto-${mes.id}" class="input-concept" placeholder="Concepto">
                                                <input type="date" id="gastos-fecha-${mes.id}" class="input-date">
                                                <input type="number" id="gastos-monto-${mes.id}" class="input-amount" placeholder="Monto" step="0.01">
                                                <button class="btn-inline" onclick="agregarMovimiento(${anio.id}, ${mes.id}, 'gastos')">+</button>
                                            </div>
                                            <div class="table-container">
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th>Concepto</th>
                                                            <th>Fecha</th>
                                                            <th>Monto</th>
                                                            <th></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        ${mes.gastos.length === 0 ? `<tr><td colspan="4" class="empty-state">Sin gastos</td></tr>` : 
                                                            mes.gastos.map((item, idx) => `
                                                                <tr>
                                                                    <td>${item.concepto}</td>
                                                                    <td>${item.fecha}</td>
                                                                    <td>$${item.monto.toFixed(2)}</td>
                                                                    <td style="text-align: center;"><button class="btn-danger" style="padding:2px 5px; font-size:0.65rem;" onclick="eliminarMovimiento(${anio.id}, ${mes.id}, 'gastos', ${idx})">X</button></td>
                                                                </tr>
                                                            `).join('')}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                yearCard.innerHTML = `
                    <div class="year-header">
                        <span class="year-title">${anio.nombre}</span>
                        <div class="year-actions">
                            <button class="btn-secondary btn-inline btn-compact" onclick="toggleMinimizarAnio(${anio.id})">${anio.minimizado ? 'Expandir' : 'Minimizar'}</button>
                            <button class="btn-secondary btn-inline btn-compact" onclick="generarResumenAnio(${anio.id})">Resumen</button>
                            <button class="btn-secondary btn-inline btn-compact" onclick="abrirModalMes(${anio.id})">+ Mes</button>
                            <button class="btn-danger btn-compact" onclick="eliminarAnio(${anio.id})">Eliminar</button>
                        </div>
                    </div>
                    <div class="months-list ${anio.minimizado ? 'hidden' : ''}">
                        ${mesesHTML}
                    </div>
                `;

                yearsContainer.appendChild(yearCard);
            });
        }
    </script>
</body>
</html>
