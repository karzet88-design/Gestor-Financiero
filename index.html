<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Ingresos y Gastos</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border-color: #2c2c2c;
            --accent: #444444;
            --accent-hover: #555555;
            --danger: #cf6679;
            --success: #81c784;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Pantalla de Bienvenida */
        #welcome-screen {
            text-align: center;
        }

        #welcome-screen h1 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        #welcome-screen p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        /* Pantalla Principal (Oculta al inicio) */
        #app-screen {
            display: none;
            width: 100%;
            max-width: 1000px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h2 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #ffffff;
        }

        /* Botones Minimalistas */
        button, .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 400;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover, .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: #5c2626;
            color: #ff8080;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background-color: #702f2f;
        }

        /* Tarjeta de Mes */
        .month-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .month-title {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: capitalize;
            color: #ffffff;
        }

        /* Resumen de Totales */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 24px;
            background: #161616;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .summary-item label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .summary-item span {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .negative {
            color: var(--danger);
        }

        .positive {
            color: var(--success);
        }

        /* Secciones de Tablas (Ingresos y Gastos) */
        .sections-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .sections-container {
                grid-template-columns: 1fr;
            }
        }

        .sub-section {
            min-width: 0;
        }

        .sub-section h4 {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        /* Formularios internos compactos */
        .inline-form {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        input, select {
            padding: 7px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            background: #161616;
            color: var(--text-main);
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: #666666;
        }

        .input-concept { flex: 2; min-width: 0; }
        .input-date { flex: 1.3; min-width: 0; }
        .input-amount { flex: 1; min-width: 0; }
        
        .inline-form button {
            padding: 7px 12px;
            font-size: 0.85rem;
        }

        /* Tablas amplias y con scroll interno si crecen mucho */
        .table-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
            table-layout: fixed;
        }

        th {
            background-color: #161616;
            position: sticky;
            top: 0;
            font-weight: 500;
            color: var(--text-muted);
            padding: 7px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 7px 8px;
            border-bottom: 1px solid var(--border-color);
            word-break: break-word;
        }

        th:nth-child(1), td:nth-child(1) { width: 40%; }
        th:nth-child(2), td:nth-child(2) { width: 32%; }
        th:nth-child(3), td:nth-child(3) { width: 20%; }
        th:nth-child(4), td:nth-child(4) { width: 8%; text-align: center; }

        tr:last-child td {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 15px;
            font-size: 0.8rem;
        }

        /* Modal para agregar mes */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 10px;
            width: 100%;
            max-width: 320px;
            border: 1px solid var(--border-color);
        }

        .modal h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 500;
            color: #ffffff;
        }

        .modal select {
            width: 100%;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- Pantalla 1: Único Botón Inicial -->
    <div id="welcome-screen">
        <h1>Control Financiero</h1>
        <p>Gestiona tus ingresos y gastos de forma simple y minimalista.</p>
        <button id="btn-nuevo-gestor">Nuevo Gestor</button>
    </div>

    <!-- Pantalla 2: Interfaz Principal del Gestor -->
    <div id="app-screen">
        <header>
            <h2>Gestor Financiero</h2>
            <button class="btn-secondary" id="btn-abrir-modal">+ Agregar Mes</button>
        </header>

        <!-- Contenedor donde se van listando los meses -->
        <div id="months-container">
            <div id="no-months" class="empty-state" style="padding: 40px;">
                No hay meses agregados. Da clic en "+ Agregar Mes" para comenzar.
            </div>
        </div>
    </div>

    <!-- Modal para seleccionar el mes a agregar -->
    <div id="modal-overlay">
        <div class="modal">
            <h3>Seleccionar Mes</h3>
            <select id="select-mes">
                <option value="Enero">Enero</option>
                <option value="Febrero">Febrero</option>
                <option value="Marzo">Marzo</option>
                <option value="Abril">Abril</option>
                <option value="Mayo">Mayo</option>
                <option value="Junio">Junio</option>
                <option value="Julio">Julio</option>
                <option value="Agosto">Agosto</option>
                <option value="Septiembre">Septiembre</option>
                <option value="Octubre">Octubre</option>
                <option value="Noviembre">Noviembre</option>
                <option value="Diciembre">Diciembre</option>
            </select>
            <div class="modal-actions">
                <button class="btn-secondary" id="btn-cerrar-modal">Cancelar</button>
                <button id="btn-guardar-mes">Agregar</button>
            </div>
        </div>
    </div>

    <script>
        // Estado de la aplicación
        let mesesData = [];

        // Elementos del DOM
        const welcomeScreen = document.getElementById('welcome-screen');
        const appScreen = document.getElementById('app-screen');
        const btnNuevoGestor = document.getElementById('btn-nuevo-gestor');
        const modalOverlay = document.getElementById('modal-overlay');
        const btnAbrirModal = document.getElementById('btn-abrir-modal');
        const btnCerrarModal = document.getElementById('btn-cerrar-modal');
        const btnGuardarMes = document.getElementById('btn-guardar-mes');
        const selectMes = document.getElementById('select-mes');
        const monthsContainer = document.getElementById('months-container');

        // Transición de bienvenida a la pestaña principal
        btnNuevoGestor.addEventListener('click', () => {
            welcomeScreen.style.display = 'none';
            appScreen.style.display = 'block';
        });

        // Controles del Modal
        btnAbrirModal.addEventListener('click', () => modalOverlay.style.display = 'flex');
        btnCerrarModal.addEventListener('click', () => modalOverlay.style.display = 'none');

        // Agregar nuevo mes
        btnGuardarMes.addEventListener('click', () => {
            const nombreMes = selectMes.value;
            
            // Verificar si el mes ya existe
            if (mesesData.some(m => m.nombre === nombreMes)) {
                alert('Este mes ya ha sido agregado.');
                return;
            }

            mesesData.push({
                id: Date.now(),
                nombre: nombreMes,
                ingresos: [],
                gastos: []
            });

            modalOverlay.style.display = 'none';
            renderizarMeses();
        });

        // Función para agregar un ingreso o gasto
        function agregarMovimiento(idMes, tipo) {
            const conceptoInput = document.getElementById(`${tipo}-concepto-${idMes}`);
            const fechaInput = document.getElementById(`${tipo}-fecha-${idMes}`);
            const montoInput = document.getElementById(`${tipo}-monto-${idMes}`);

            const concepto = conceptoInput.value.trim();
            const fecha = fechaInput.value;
            const monto = parseFloat(montoInput.value);

            if (!concepto || !fecha || isNaN(monto)) {
                alert('Por favor completa todos los campos correctamente.');
                return;
            }

            const mes = mesesData.find(m => m.id === idMes);
            if (mes) {
                mes[tipo].push({ concepto, fecha, monto });
                conceptoInput.value = '';
                fechaInput.value = '';
                montoInput.value = '';
                renderizarMeses();
            }
        }

        // Función para eliminar un registro individual
        function eliminarMovimiento(idMes, tipo, index) {
            const mes = mesesData.find(m => m.id === idMes);
            if (mes) {
                mes[tipo].splice(index, 1);
                renderizarMeses();
            }
        }

        // Renderizado general de la interfaz de meses
        function renderizarMeses() {
            if (mesesData.length === 0) {
                monthsContainer.innerHTML = `<div id="no-months" class="empty-state" style="padding: 40px;">No hay meses agregados. Da clic en "+ Agregar Mes" para comenzar.</div>`;
                return;
            }

            monthsContainer.innerHTML = '';

            mesesData.forEach(mes => {
                // Calcular totales
                const totalIngresos = mes.ingresos.reduce((acc, item) => acc + item.monto, 0);
                const totalGastos = mes.gastos.reduce((acc, item) => acc + item.monto, 0);
                const restante = totalIngresos - totalGastos;

                const card = document.createElement('div');
                card.className = 'month-card';

                card.innerHTML = `
                    <div class="month-header">
                        <span class="month-title">${mes.nombre}</span>
                        <button class="btn-danger" onclick="eliminarMes(${mes.id})">Eliminar Mes</button>
                    </div>

                    <!-- Tabla Resumen -->
                    <div class="summary-grid">
                        <div class="summary-item">
                            <label>Total Ingresos</label>
                            <span class="positive">$${totalIngresos.toFixed(2)}</span>
                        </div>
                        <div class="summary-item">
                            <label>Total Gastos</label>
                            <span class="negative">$${totalGastos.toFixed(2)}</span>
                        </div>
                        <div class="summary-item">
                            <label>Restante a Fin de Mes</label>
                            <span class="${restante < 0 ? 'negative' : 'positive'}">$${restante.toFixed(2)}</span>
                        </div>
                    </div>

                    <!-- Secciones de Ingresos y Gastos -->
                    <div class="sections-container">
                        <!-- Sección Ingresos -->
                        <div class="sub-section">
                            <h4>Ingresos</h4>
                            <div class="inline-form">
                                <input type="text" id="ingresos-concepto-${mes.id}" class="input-concept" placeholder="Concepto">
                                <input type="date" id="ingresos-fecha-${mes.id}" class="input-date">
                                <input type="number" id="ingresos-monto-${mes.id}" class="input-amount" placeholder="Monto" step="0.01">
                                <button onclick="agregarMovimiento(${mes.id}, 'ingresos')">+</button>
                            </div>
                            <div class="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Concepto</th>
                                            <th>Fecha</th>
                                            <th>Monto</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${mes.ingresos.length === 0 ? `<tr><td colspan="4" class="empty-state">Sin ingresos registrados</td></tr>` : 
                                            mes.ingresos.map((item, idx) => `
                                                <tr>
                                                    <td>${item.concepto}</td>
                                                    <td>${item.fecha}</td>
                                                    <td>$${item.monto.toFixed(2)}</td>
                                                    <td style="text-align: center;"><button class="btn-danger" style="padding:2px 5px; font-size:0.65rem;" onclick="eliminarMovimiento(${mes.id}, 'ingresos', ${idx})">X</button></td>
                                                </tr>
                                            `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Sección Gastos -->
                        <div class="sub-section">
                            <h4>Gastos</h4>
                            <div class="inline-form">
                                <input type="text" id="gastos-concepto-${mes.id}" class="input-concept" placeholder="Concepto">
                                <input type="date" id="gastos-fecha-${mes.id}" class="input-date">
                                <input type="number" id="gastos-monto-${mes.id}" class="input-amount" placeholder="Monto" step="0.01">
                                <button onclick="agregarMovimiento(${mes.id}, 'gastos')">+</button>
                            </div>
                            <div class="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Concepto</th>
                                            <th>Fecha</th>
                                            <th>Monto</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${mes.gastos.length === 0 ? `<tr><td colspan="4" class="empty-state">Sin gastos registrados</td></tr>` : 
                                            mes.gastos.map((item, idx) => `
                                                <tr>
                                                    <td>${item.concepto}</td>
                                                    <td>${item.fecha}</td>
                                                    <td>$${item.monto.toFixed(2)}</td>
                                                    <td style="text-align: center;"><button class="btn-danger" style="padding:2px 5px; font-size:0.65rem;" onclick="eliminarMovimiento(${mes.id}, 'gastos', ${idx})">X</button></td>
                                                </tr>
                                            `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
                monthsContainer.appendChild(card);
            });
        }

        function eliminarMes(idMes) {
            mesesData = mesesData.filter(m => m.id !== idMes);
            renderizarMeses();
        }
    </script>
</body>
</html>
